services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: patchproof
      POSTGRES_PASSWORD: patchproof
      POSTGRES_DB: patchproof
    ports:
      - "5432:5432"
    volumes:
      - patchproof_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchproof -d patchproof"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://patchproof:patchproof@db:5432/patchproof
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      DEBUG: ${DEBUG:-true}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend --reload-dir core --reload-dir cli --reload-dir llm --reload-dir models"

volumes:
  patchproof_postgres_data: