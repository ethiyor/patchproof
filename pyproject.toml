[project]
name = "patchproof"
version = "0.1.0"
description = "A spec-to-merge verification tool for AI-generated code changes"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "gitpython>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
patchproof = "cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "models*"]
